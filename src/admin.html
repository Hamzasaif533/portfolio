<title>Editor</title>


<style>
@font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-mono-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-mono-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
/* Arabic letters come from Rubik (OFL, assets/fonts/OFL-Rubik.txt): rounded, like the look you picked */
@font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 300 900; font-display: swap; src: url(/assets/fonts/rubik-arabic.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
/* surfaces get lighter as they come closer: page → panel → raised → hover */
:root {
  --bg: #000; --panel: #0a0a0a; --raised: #111; --hover: #171717; --fg: #f2f2f2; --soft: #c9c9c9; --mute: #8b8b8b; --dim: #555;
  --line: #1c1c1c; --line-2: #2a2a2a; --chip: #141414; --chip-line: rgba(255,255,255,.08); --warn: #e8c66a; --bad: #ff8a8a; --ok: #8fd19e;
  --r: 8px; --r-lg: 16px; --mono: "Geist Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; background: var(--bg); }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.6 var(--mono); min-height: 100vh; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
::selection { background: #fff; color: #000; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- sidebar ---------- */
nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; scrollbar-width: none; padding: 18px 12px 16px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 1px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; color: var(--mute); font-size: 12px; }
.brand .logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--r); background: var(--raised); border: 1px solid var(--chip-line); color: var(--fg); }
.brand .logo svg { width: 17px; height: 17px; }
.brand b { display: block; color: var(--fg); font-weight: 500; font-size: 13px; line-height: 1.3; }
.jump { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--dim); cursor: pointer; text-align: left; font-size: 12px; }
.jump:hover { color: var(--mute); border-color: var(--line-2); }
.jump kbd { margin-left: auto; }
kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--raised); color: var(--mute); font: 10px/1 var(--mono); }
nav .group { padding: 14px 10px 5px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
nav button.nv { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 0; border-radius: var(--r); background: none; color: var(--mute); cursor: pointer; white-space: nowrap; text-align: left; transition: background .12s, color .12s; }
nav button.nv:hover { background: var(--raised); color: var(--soft); }
nav button.nv[aria-current] { background: var(--hover); color: var(--fg); }
nav button.nv .lb { flex: 1; }
nav button.nv .ct { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
nav button.nv .wd { width: 6px; height: 6px; border-radius: 2px; background: var(--warn); }
nav .sep { display: none; }
nav .foot { margin-top: auto; padding: 16px 10px 0; font-size: 11.5px; line-height: 1.6; color: var(--dim); display: grid; gap: 8px; }
nav .foot a, nav .foot button { color: var(--mute); }

/* ---------- page ---------- */
main { padding: 0 36px 120px; max-width: 1040px; width: 100%; min-width: 0; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 18px 0 14px; margin-bottom: 6px; background: linear-gradient(var(--bg) 80%, transparent); }
.bar h1 { font-size: 18px; font-weight: 500; letter-spacing: -.01em; flex: 1; min-width: 8em; display: flex; align-items: center; gap: 10px; }
.bar h1 svg.i { width: 18px; height: 18px; color: var(--mute); }
#saveState { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r); font-size: 11.5px; color: var(--mute); }
#saveState:empty { display: none; }
#saveState.unsaved { background: rgba(232,198,106,.08); color: var(--warn); }
#saveState.unsaved::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: currentColor; }
#saveState.saved { color: var(--ok); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 5px 13px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--raised); cursor: pointer; white-space: nowrap; text-decoration: none; font-size: 12.5px; transition: background .12s, border-color .12s, color .12s; }
.btn:hover { background: var(--hover); border-color: #3a3a3a; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 500; }
.btn.primary:hover { background: #fff; }
.btn.primary:disabled { background: var(--raised); color: var(--dim); border-color: var(--line-2); cursor: default; font-weight: 400; }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 28px; padding: 3px 10px; font-size: 12px; }
.btn kbd { margin-left: 2px; background: transparent; border-color: currentColor; color: inherit; opacity: .45; }
.status { font-size: 12px; color: var(--mute); }
.warn { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 12px; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: var(--warn); border: 1px solid rgba(232,198,106,.22); border-radius: var(--r); background: rgba(232,198,106,.05); }
.warn span { flex: 1 1 260px; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 12px; }
.tools input[type=search] { flex: 1 1 220px; }
input[type=text], input[type=number], input[type=url], input[type=date], input[type=search], input[type=password], select, textarea {
  width: 100%; min-height: 34px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); outline: none; transition: border-color .12s, background .12s; }
input:hover, select:hover, textarea:hover { border-color: #353535; }
input:focus, select:focus, textarea:focus { border-color: #5a5a5a; background: #0d0d0d; }
input::placeholder, textarea::placeholder { color: #4a4a4a; }
textarea { min-height: 90px; resize: vertical; line-height: 1.7; }
textarea.body { min-height: 60vh; font-size: 15px; }

/* ---------- lists ---------- */
.items { display: grid; gap: 4px; }
.item { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); transition: border-color .12s, background .12s; }
.item:hover { border-color: var(--line-2); }
.item.open { border-color: var(--line-2); background: #0c0c0c; }
.item > header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 8px 7px 8px; cursor: pointer; min-height: 50px; }
.item .tn { width: 30px; height: 44px; border-radius: 5px; background: var(--raised) center / cover no-repeat; border: 1px solid var(--line); }
.item .tn.none { width: 8px; border: 0; background: none; }
.item > header .sum { display: grid; min-width: 0; }
.item > header .sum > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item > header .sum b { font-weight: 500; }
.item > header .sum small { color: var(--mute); font-size: 12px; }
.item > header .sum .miss { color: var(--warn); }
.item > header .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.item:hover > header .acts, .item.open > header .acts, .item > header .acts:focus-within { opacity: 1; }
.icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--r); border: 1px solid transparent; background: none; color: var(--mute); cursor: pointer; }
.icon:hover { background: var(--hover); color: var(--fg); }
.icon:focus-visible { border-color: var(--fg); }
.icon.del:hover { color: var(--bad); }
.item .form { display: none; padding: 4px 16px 16px; }
.item.open .form { display: grid; }
.item.open > header { border-bottom: 1px solid var(--line); }
.form { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; padding-top: 14px !important; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field.wide { grid-column: 1 / -1; }
.field > span { font-size: 11.5px; color: var(--mute); }
/* on/off switch */
.check { display: flex; gap: 10px; align-items: center; align-self: end; min-height: 34px; cursor: pointer; color: var(--soft); font-size: 12.5px; }
.check input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 32px; height: 18px; border-radius: 6px; background: var(--line-2); cursor: pointer; transition: background .15s; }
.check input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 4px; background: #8b8b8b; transition: transform .15s, background .15s; }
.check input:checked { background: var(--fg); }
.check input:checked::after { transform: translateX(14px); background: #000; }
/* half-star rating */
.stars { display: flex; align-items: center; gap: 2px; min-height: 34px; }
.stars .st { position: relative; width: 22px; height: 22px; color: #2e2e2e; font-size: 20px; line-height: 22px; text-align: center; user-select: none; }
.stars .st .half, .stars .st .full { position: absolute; inset: 0; overflow: hidden; color: var(--fg); pointer-events: none; }
.stars .st .half { width: 50%; text-align: left; }
.stars .st .half::before, .stars .st .full::before { content: "★"; display: block; width: 22px; text-align: center; }
.stars .st button { position: absolute; top: 0; bottom: 0; width: 50%; padding: 0; border: 0; background: none; cursor: pointer; }
.stars .st button.l { left: 0; } .stars .st button.r { right: 0; }
.stars .val { margin-left: 10px; font-size: 12px; color: var(--mute); min-width: 2.5em; }
.stars .clr { margin-left: 2px; }
.media { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; }
.thumb { width: 96px; height: 60px; border-radius: var(--r); background: var(--raised) center / cover no-repeat; border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--dim); }
.media .row { display: flex; flex-wrap: wrap; gap: 6px; }
.media .row input { flex: 1 1 160px; }
.panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 10px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); }
.empty { color: var(--dim); padding: 20px 0; }
.finder { margin: 0 0 14px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.finder[hidden] { display: none; }
.finder .inline { display: flex; gap: 8px; align-items: center; }
.found { margin-top: 10px; display: grid; gap: 4px; }
.found li { list-style: none; border-radius: var(--r); }
.found li.sel { background: #161616; }
.found li.none { padding: 10px; color: var(--dim); }
.found button { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--r); background: none; text-align: start; cursor: pointer; }
.found .poster { width: 40px; height: 60px; border-radius: var(--r); background: #0b0b0b center / cover no-repeat; border: 1px solid var(--line); }
.found .meta { display: grid; }
.found .meta b { font-weight: 500; }
.found small { color: var(--mute); }
.found .have { color: var(--dim); }
.pick-list { display: grid; gap: 22px; }
.pick header { display: flex; align-items: baseline; gap: 4px; margin-bottom: 8px; }
.pick header b { font-weight: 500; }
.pick header small { color: var(--mute); }
.pick header .has { color: var(--dim); }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: #222 transparent; min-height: 40px; align-items: center; }
.still { flex: none; width: 180px; aspect-ratio: 16 / 9; padding: 0; border: 2px solid transparent; border-radius: var(--r); overflow: hidden; background: #0b0b0b; cursor: pointer; scroll-snap-align: start; }
.still img { display: block; width: 100%; height: 100%; object-fit: cover; }
.still.on { border-color: var(--fg); }
.steps { display: grid; gap: 6px; padding-left: 1.2em; color: var(--mute); }
.steps a { color: var(--fg); }
@media (max-width: 760px) { .still { width: 150px; } }
.top4-pick header { flex-wrap: wrap; align-items: center; gap: 8px; }
.top4-pick header b { width: 1.4em; }
.top4-pick select { flex: 1 1 220px; min-width: 0; }
.poster-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; }
.poster-now { display: grid; gap: 6px; }
.poster-now img, .poster-now span { display: grid; place-items: center; width: 200px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: var(--r); border: 1px solid var(--line); background: #0b0b0b; color: var(--dim); font-size: 11px; text-align: center; padding: 0; }
.poster-now span { padding: 8px; }
.poster-now small { color: var(--mute); font-size: 11px; }
.still.poster { width: 180px; aspect-ratio: 2 / 3; border-radius: var(--r); }
.cover-field .poster-row { grid-template-columns: 140px minmax(0, 1fr); }
.cover-field .still.poster { width: 110px; }
.cover-field .pd-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.sub { margin: 26px 0 12px; font-size: 13px; font-weight: 500; }
.sub small { color: var(--mute); font-weight: 400; }
.poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 18px 14px; }
.pg-cell { display: grid; gap: 6px; padding: 0; border: 0; background: none; color: var(--mute); font: inherit; font-size: 11px; text-align: start; cursor: pointer; min-width: 0; }
.pg-cell img, .pg-cell .ph { display: grid; place-items: center; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: var(--r); border: 2px solid transparent; background: #0b0b0b; color: var(--dim); font-size: 10px; text-align: center; padding: 4px; }
.pg-cell img { padding: 0; }
.pg-cell.own img { border-color: var(--fg); }
.pg-cell span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-cell:hover span:last-child { color: var(--fg); }
dialog.poster-dlg { width: min(1100px, 100% - 24px); max-height: 90vh; margin: auto; padding: 16px; color: var(--fg); background: rgba(10, 10, 10, .95); border: 1px solid rgba(255, 255, 255, .16); border-radius: 16px; box-shadow: 0 30px 80px -20px #000; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 18px 12px; }
.ph-cell { display: grid; justify-items: center; gap: 8px; padding: 0; border: 0; background: none; color: var(--mute); font: inherit; font-size: 11px; cursor: pointer; min-width: 0; }
.ph-cell > span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-cell:hover > span:last-child { color: var(--fg); }
.pic { display: grid; place-items: center; width: 72px; height: 72px; object-fit: cover; object-position: 50% 22%; border: 2px solid transparent; background: #141414; color: var(--dim); font-size: 10px; box-sizing: border-box; }
.pic.person { border-radius: var(--r); }
.pic.studio { border-radius: 8px; object-fit: contain; background: #e9e9e9; padding: 6px; }
.ph-cell.own .pic { border-color: var(--fg); }
.photo-row { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 16px; align-items: start; }
.photo-now { display: grid; justify-items: center; gap: 8px; }
.photo-now .pic { width: 120px; height: 120px; }
.photo-now small { color: var(--mute); font-size: 11px; }
.strip-h { margin: 0 0 8px; font-size: 11px; font-weight: 400; color: var(--mute); }
.strip.photos { margin-bottom: 16px; }
.still.photo { width: 120px; aspect-ratio: 2 / 3; }
.still.photo.studio { aspect-ratio: 3 / 2; background: #e9e9e9; }
.still.photo.studio img { object-fit: contain; padding: 8px; box-sizing: border-box; }
@media (max-width: 760px) { .photo-row { grid-template-columns: 1fr; } .still.photo { width: 96px; } .photo-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); } .pic { width: 60px; height: 60px; } }
dialog.crop-dlg { width: min(340px, 100% - 24px); }
.crop-view { position: relative; width: 260px; height: 260px; margin: 4px auto 0; overflow: hidden; background: #141414; cursor: grab; touch-action: none; user-select: none; }
.crop-view.dragging { cursor: grabbing; }
.crop-view.person { border-radius: var(--r); }
.crop-view.studio { border-radius: var(--r); background: #e9e9e9; }
.crop-view img { position: absolute; left: 50%; top: 50%; max-width: none; height: auto; pointer-events: none; }
.crop-ring { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); pointer-events: none; }
.crop-zoom { display: flex; align-items: center; gap: 10px; margin: 16px 4px 4px; color: var(--mute); }
.crop-zoom input { flex: 1; accent-color: var(--fg); }
.crop-hint { margin: 6px 0 14px; font-size: 11px; text-align: center; }
.crop-actions { display: flex; justify-content: flex-end; gap: 8px; }
dialog.poster-dlg::backdrop { background: rgba(0, 0, 0, .72); }
.poster-dlg header { display: flex; align-items: baseline; gap: 4px; margin-bottom: 12px; }
.poster-dlg header b { font-weight: 500; }
.poster-dlg header small { color: var(--mute); }
.poster-dlg .x { margin-left: auto; }
.pd-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
@media (max-width: 760px) { .poster-row { grid-template-columns: 1fr; } .poster-now img, .poster-now span { width: 140px; } .still.poster { width: 140px; } .poster-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 14px 10px; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: var(--r); background: #161616; border: 1px solid var(--line-2); box-shadow: 0 16px 40px -12px #000; font-size: 12.5px; opacity: 0; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; }
.toast::before { content: "✓"; color: var(--ok); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.err { color: var(--bad); }
.toast.err::before { content: "!"; color: var(--bad); }

/* Ctrl+K: jump to a section or any item */
dialog.jumper { width: min(560px, 100% - 24px); margin: 12vh auto auto; padding: 0; color: var(--fg); background: rgba(14,14,14,.97); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: 0 30px 80px -20px #000; overflow: hidden; }
dialog.jumper::backdrop { background: rgba(0,0,0,.6); }
.jumper input { border: 0 !important; border-bottom: 1px solid var(--line) !important; border-radius: 0 !important; background: none !important; min-height: 48px; padding: 12px 16px; font-size: 14px; }
.jumper ul { max-height: 50vh; overflow-y: auto; padding: 6px; list-style: none; }
.jumper li button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: var(--r); background: none; text-align: left; cursor: pointer; color: var(--soft); }
.jumper li button small { margin-left: auto; color: var(--dim); font-size: 11px; }
.jumper li.sel button { background: var(--hover); color: var(--fg); }
.jumper .none { padding: 14px 12px; color: var(--dim); }

<body>
<nav id="nav" aria-label="Sections"></nav>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* The local dev server replaces this with a secret key. On the live site it stays
   as-is, which switches the editor to GitHub mode (needs your personal access token). */
const TOKEN = "__ADMIN_TOKEN__";
const LOCAL = !TOKEN.startsWith("__");

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && el.append(c.nodeType ? c : document.createTextNode(c)));
  return el;
};
function toast(msg, err) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast on" + (err ? " err" : "");
  clearTimeout(t._t); t._t = setTimeout(() => (t.className = "toast"), err ? 5000 : 2600);
}
const stars = r => r ? "★".repeat(Math.floor(r)) + (r % 1 ? "½" : "") : "";
const SLUG = /^[a-z0-9][a-z0-9-]{0,80}$/;
const slugify = s => String(s).toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-");

/* ---------- posts: front matter <-> fields (same rules as build.js) ---------- */
function parsePost(slug, raw) {
  raw = raw.replace(/^﻿/, "").replace(/\r\n/g, "\n");
  const m = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  const meta = {};
  if (m) m[1].split("\n").forEach(l => { const kv = l.match(/^(\w+)\s*:\s*(.*)$/); if (kv) meta[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, ""); });
  return { slug, meta, body: (m ? m[2] : raw).replace(/^\n+/, "") };
}
function serializePost(meta, body) {
  const fm = ["title", "date", "summary", "lang", "draft"].filter(k => meta[k] && meta[k] !== "false").map(k => `${k}: ${String(meta[k]).replace(/\n/g, " ")}`).join("\n");
  return `---\n${fm}\n---\n\n${String(body || "").replace(/\r\n/g, "\n").trim()}\n`;
}

/* ---------- storage: local dev server, or GitHub ---------- */
const objectUrls = {}; // previews for files uploaded this session (before the site rebuilds)
const thumbUrl = p => objectUrls[p] || "/" + p;

async function localApi(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-Admin-Token": TOKEN, ...(opts.body && !(opts.body instanceof Blob) ? { "Content-Type": "application/json" } : {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const LocalStore = {
  savedMsg: "Saved · site rebuilt",
  getSite: () => localApi("/api/site"),
  putSite: data => localApi("/api/site", { method: "PUT", body: JSON.stringify(data) }),
  listPosts: () => localApi("/api/posts"),
  getPost: slug => localApi(`/api/post?slug=${slug}`),
  putPost: (old, newSlug, meta, body) => localApi(`/api/post?slug=${old || newSlug}`, { method: "PUT", body: JSON.stringify({ meta, body, newSlug, isNew: !old }) }).then(r => r.slug),
  deletePost: slug => localApi(`/api/post?slug=${slug}`, { method: "DELETE" }),
  upload: async (file, folder) => {
    const r = await localApi(`/api/upload?folder=${folder}&name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
    objectUrls[r.path] = URL.createObjectURL(file);
    return r.path;
  },
};

/* GitHub: every save is a commit, so git history is your backup. */
const CFG_KEY = "editor-github";
let gh = null; // { repo, branch, token }
const shas = {}; // file path -> current sha (needed to update/delete)
const textToB64 = text => { const bytes = new TextEncoder().encode(text); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const b64ToText = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
const fileToB64 = file => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(file); });
const encPath = p => p.split("/").map(encodeURIComponent).join("/");

async function ghReq(path, opts = {}, allow404) {
  const res = await fetch(`https://api.github.com/repos/${gh.repo}${path}`, {
    ...opts,
    cache: "no-store",
    headers: { Authorization: `Bearer ${gh.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (res.status === 404 && allow404) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401) throw new Error("GitHub didn't accept this token. Check it hasn't expired, then sign in again.");
    if (res.status === 404 && !path) throw new Error("Repository not found, or the token can't see it. Check the name and the token's repository access.");
    if (res.status === 409 || (res.status === 422 && /sha/i.test(data.message || ""))) throw new Error("This was changed somewhere else. Reload the editor and try again.");
    throw new Error(data.message || `GitHub error ${res.status}`);
  }
  return data;
}
const ghGet = async (p, allow404) => { const r = await ghReq(`/contents/${encPath(p)}?ref=${encodeURIComponent(gh.branch)}`, {}, allow404); if (!r) return null; shas[p] = r.sha; return { sha: r.sha, text: r.content ? b64ToText(r.content) : "" }; };
const ghPut = async (p, b64, message) => { const r = await ghReq(`/contents/${encPath(p)}`, { method: "PUT", body: JSON.stringify({ message, content: b64, branch: gh.branch, ...(shas[p] ? { sha: shas[p] } : {}) }) }); shas[p] = r.content.sha; return r; };
const ghDel = async (p, message) => { if (!shas[p]) await ghGet(p); await ghReq(`/contents/${encPath(p)}`, { method: "DELETE", body: JSON.stringify({ message, sha: shas[p], branch: gh.branch }) }); delete shas[p]; };

const GitHubStore = {
  savedMsg: "Saved · the site updates in about a minute",
  getSite: async () => JSON.parse((await ghGet("content/site.json")).text),
  putSite: data => ghPut("content/site.json", textToB64(JSON.stringify(data, null, 2) + "\n"), "Update content"),
  listPosts: async () => {
    const files = ((await ghReq(`/contents/content/posts?ref=${encodeURIComponent(gh.branch)}`, {}, true)) || []).filter(f => f.name.endsWith(".md"));
    const posts = await Promise.all(files.map(async f => {
      const { meta } = parsePost(f.name.slice(0, -3), (await ghGet(f.path)).text);
      return { slug: f.name.slice(0, -3), title: meta.title || f.name, date: meta.date || "", lang: meta.lang || "", draft: meta.draft === "true" };
    }));
    return posts.sort((a, b) => (a.date < b.date ? 1 : -1));
  },
  getPost: async slug => parsePost(slug, (await ghGet(`content/posts/${slug}.md`)).text),
  putPost: async (old, newSlug, meta, body) => {
    const target = newSlug || old;
    if (!SLUG.test(target)) throw new Error("Slug can only use a-z, 0-9 and -");
    const path = `content/posts/${target}.md`;
    if (!old || target !== old) { // new post or renamed: never overwrite another post
      if (await ghGet(path, true)) throw new Error("A post with that slug already exists");
      delete shas[path];
    }
    await ghPut(path, textToB64(serializePost(meta, body)), `${old && target === old ? "Update" : "Add"} post: ${meta.title}`);
    if (old && target !== old) await ghDel(`content/posts/${old}.md`, `Rename post ${old} -> ${target}`);
    return target;
  },
  deletePost: slug => ghDel(`content/posts/${slug}.md`, `Delete post: ${slug}`),
  upload: async (file, folder) => {
    if (file.size > 50 * 1024 * 1024) throw new Error("That file is over 50 MB. Please compress it first.");
    const dot = file.name.lastIndexOf("."), ext = dot > 0 ? file.name.slice(dot).toLowerCase() : "";
    if (!/^\.(jpe?g|png|webp|avif|gif|svg|mp4|webm|mov)$/.test(ext)) throw new Error("Unsupported file type");
    const base = slugify(file.name.slice(0, dot)) || "file";
    let name = base + ext, n = 2;
    while (await ghReq(`/contents/${encPath(`assets/${folder}/${name}`)}?ref=${encodeURIComponent(gh.branch)}`, {}, true)) name = `${base}-${n++}${ext}`;
    const path = `assets/${folder}/${name}`;
    await ghPut(path, await fileToB64(file), `Upload ${name}`);
    objectUrls[path] = URL.createObjectURL(file);
    return path;
  },
};
/* several files + content in ONE commit (one site rebuild instead of dozens) */
async function ghCommit(files, message) {
  const ref = await ghReq(`/git/ref/heads/${encodeURIComponent(gh.branch)}`);
  const parent = await ghReq(`/git/commits/${ref.object.sha}`);
  const tree = [];
  for (const f of files) {
    const blob = await ghReq("/git/blobs", { method: "POST", body: JSON.stringify({ content: f.b64, encoding: "base64" }) });
    tree.push({ path: f.path, mode: "100644", type: "blob", sha: blob.sha });
  }
  const newTree = await ghReq("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: parent.tree.sha, tree }) });
  const commit = await ghReq("/git/commits", { method: "POST", body: JSON.stringify({ message, tree: newTree.sha, parents: [ref.object.sha] }) });
  await ghReq(`/git/refs/heads/${encodeURIComponent(gh.branch)}`, { method: "PATCH", body: JSON.stringify({ sha: commit.sha }) });
  for (const f of files) delete shas[f.path];
}
/* Preview: your unsaved content as one commit on a separate "preview" branch (your branch is not touched).
   Cloudflare Pages builds it at preview.<project>.pages.dev; that copy is hidden from search engines. */
const PREVIEW_BRANCH = "preview";
async function ghPreview(data) {
  if (gh.branch === PREVIEW_BRANCH) throw new Error(`You're editing the ${PREVIEW_BRANCH} branch itself.`);
  const ref = await ghReq(`/git/ref/heads/${encodeURIComponent(gh.branch)}`);
  const parent = await ghReq(`/git/commits/${ref.object.sha}`);
  const blob = await ghReq("/git/blobs", { method: "POST", body: JSON.stringify({ content: textToB64(JSON.stringify(data, null, 2) + "\n"), encoding: "base64" }) });
  const tree = await ghReq("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: parent.tree.sha, tree: [{ path: "content/site.json", mode: "100644", type: "blob", sha: blob.sha }] }) });
  const commit = await ghReq("/git/commits", { method: "POST", body: JSON.stringify({ message: "Preview (not published)", tree: tree.sha, parents: [ref.object.sha] }) });
  const have = await ghReq(`/git/ref/heads/${PREVIEW_BRANCH}`, {}, true);
  if (have) await ghReq(`/git/refs/heads/${PREVIEW_BRANCH}`, { method: "PATCH", body: JSON.stringify({ sha: commit.sha, force: true }) });
  else await ghReq("/git/refs", { method: "POST", body: JSON.stringify({ ref: `refs/heads/${PREVIEW_BRANCH}`, sha: commit.sha }) });
  const host = location.hostname.endsWith(".pages.dev") ? location.hostname.split(".").slice(-3).join(".") : "";
  return host ? `https://${PREVIEW_BRANCH}.${host}/` : "";
}
async function previewSite(btn) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Preparing…";
  try {
    if (LOCAL) {
      await localApi("/api/preview", { method: "PUT", body: JSON.stringify(site) });
      window.open("/", "_blank", "noopener");
      toast("Preview built here (not saved). Press Save to keep it.");
    } else {
      const url = await ghPreview(site);
      toast(url ? "Preview is building: it's ready in about a minute." : `Preview pushed to the "${PREVIEW_BRANCH}" branch. Open it from Cloudflare Pages → Deployments.`);
      if (url) window.open(url, "_blank", "noopener");
    }
  } catch (err) { toast(err.message, true); }
  btn.disabled = false; btn.textContent = label;
}

/* Every frame also gets a small copy in assets/frames-sm (same name, .jpg): the Frames wall and Stats use it,
   the full frame opens in the viewer. Returns null when the frame is already small. */
const smallFramePath = p => p.replace(/^assets\/frames\//, "assets/frames-sm/").replace(/\.\w+$/, ".jpg");
async function smallFrameOf(blob) { if (!/^image\/(jpeg|png|webp)/.test(blob.type || "image/jpeg")) return null; const sm = await shrinkPoster(blob, 640, .78); return sm === blob ? null : sm; }
async function uploadSmallFrame(blob, fullPath) {
  try {
    const sm = await smallFrameOf(blob); if (!sm) return;
    await store.upload(new File([sm], smallFramePath(fullPath).split("/").pop(), { type: "image/jpeg" }), "frames-sm");
  } catch (_) {} // the full frame still works on its own
}
/* Frame links are written to a copy and only applied after the save succeeds,
   so a failed save never leaves a link to an image that wasn't stored. */
function withFrames(data, picks, paths) {
  const next = structuredClone(data);
  picks.forEach((p, i) => { next.movies[data.movies.indexOf(p.movie)].frame = paths[i]; });
  return next;
}
LocalStore.saveFrames = async (picks, data) => {
  const paths = [];
  for (const p of picks) { const path = await LocalStore.upload(new File([p.blob], p.name, { type: p.blob.type || "image/jpeg" }), "frames"); paths.push(path); await uploadSmallFrame(p.blob, path); }
  await LocalStore.putSite(withFrames(data, picks, paths));
  picks.forEach((p, i) => (p.movie.frame = paths[i]));
};
GitHubStore.saveFrames = async (picks, data) => {
  // Never save an old copy over newer content (e.g. edited on another device meanwhile):
  // if the file changed since it was loaded, add the picked frames to the latest version instead.
  const loadedSha = shas["content/site.json"];
  const latest = await ghGet("content/site.json");
  if (latest.sha !== loadedSha) {
    if (dirty) throw new Error("Your content was changed somewhere else, and you have other unsaved edits here. Reload the editor and pick again.");
    data = JSON.parse(latest.text);
    for (const p of picks) {
      const m = (data.movies || []).find(x => x.title === p.movie.title && String(x.year || "") === String(p.movie.year || ""));
      if (!m) throw new Error(`"${p.movie.title}" isn't in your latest movie list anymore. Reload the editor.`);
      p.movie = m;
    }
    site = data; // the editor now shows the latest content
  }
  const files = [], paths = picks.map(p => `assets/frames/${p.name}`);
  for (let i = 0; i < picks.length; i++) {
    files.push({ path: paths[i], b64: await fileToB64(picks[i].blob) });
    const sm = await smallFrameOf(picks[i].blob);
    if (sm) files.push({ path: smallFramePath(paths[i]), b64: await fileToB64(sm) });
  }
  files.push({ path: "content/site.json", b64: textToB64(JSON.stringify(withFrames(data, picks, paths), null, 2) + "\n") });
  await ghCommit(files, `Add ${picks.length} film frame${picks.length === 1 ? "" : "s"}`);
  // only now, after GitHub has the images, does the editor show the new links
  picks.forEach((p, i) => { p.movie.frame = paths[i]; objectUrls[paths[i]] = URL.createObjectURL(p.blob); });
  await ghGet("content/site.json"); // pick up the new version for the next save
};
const store = LOCAL ? LocalStore : GitHubStore;

/* ---------- TMDB: find stills for your movies ---------- */
const TMDB_KEY = "editor-tmdb";
const tmdbKey = () => { try { return localStorage.getItem(TMDB_KEY) || ""; } catch (_) { return ""; } };
async function tmdb(path, params = {}) {
  const key = tmdbKey();
  const url = new URL("https://api.themoviedb.org/3" + path);
  Object.entries(params).forEach(([k, v]) => v !== "" && v != null && url.searchParams.set(k, v));
  const bearer = key.startsWith("eyJ"); // long "API Read Access Token" vs short "API Key"
  if (!bearer) url.searchParams.set("api_key", key);
  const res = await fetch(url, { headers: bearer ? { Authorization: `Bearer ${key}` } : {} });
  if (res.status === 401) throw new Error("TMDB didn't accept the key.");
  if (!res.ok) throw new Error(`TMDB error ${res.status}`);
  return res.json();
}
const stillCache = new Map();
async function findStills(m) {
  const k = `${m.title}|${m.year || ""}`;
  if (stillCache.has(k)) return stillCache.get(k);
  const job = (async () => {
    let hit = m.tmdb ? { id: m.tmdb } : null, kind = "movie", r; // films added by search remember their exact TMDB id
    if (!hit) { r = await tmdb("/search/movie", { query: m.title, year: m.year }); hit = r.results && r.results[0]; }
    if (!hit && m.year) { r = await tmdb("/search/movie", { query: m.title }); hit = r.results && r.results[0]; }
    if (!hit) { r = await tmdb("/search/tv", { query: m.title }); hit = r.results && r.results[0]; kind = "tv"; } // e.g. series
    if (!hit) return [];
    const imgs = await tmdb(`/${kind}/${hit.id}/images`, { include_image_language: "null" }); // stills without text on them
    return (imgs.backdrops || []).sort((a, b) => b.vote_average - a.vote_average || b.width - a.width).slice(0, 12).map(b => b.file_path);
  })();
  stillCache.set(k, job);
  job.catch(() => stillCache.delete(k));
  return job;
}

async function upload(file, folder) {
  toast(`Uploading ${file.name}…`);
  const p = await store.upload(file, folder);
  toast("Uploaded");
  return p;
}

    fields: [{ key: "name", label: "Name" }, { key: "status", label: "Status (e.g. shipped 2026)" }, { key: "description", type: "textarea", label: "Description", wide: true },
      { key: "tags", type: "tags", label: "Tags (comma separated)", wide: true }, { key: "repo", type: "url", label: "Code link" }, { key: "live", type: "url", label: "Live link" },
      { key: "now", type: "check", label: "Now (show on home)" }, { key: "hidden", type: "check", label: "Hide from the site (also hides the GitHub repo with this name)" },
      { key: "image", type: "media", folder: "code", label: "Screenshot or video", wide: true }] },
  designs: { label: "Design", path: ["designs"], sum: it => [it.title, [it.tools, it.year].filter(Boolean).join(" · ")],
    fields: [{ key: "title", label: "Title" }, { key: "tools", label: "Tools" }, { key: "year", type: "number", label: "Year" }, { key: "note", label: "Note" },
      { key: "image", type: "media", folder: "designs", label: "Image", wide: true }] },
  qa: { label: "Q&A", path: ["about", "qa"], sum: it => [it.q, ""], fields: [{ key: "q", label: "Question", wide: true }, { key: "a", type: "paras", label: "Answer (blank line = new paragraph)", wide: true }] },
  experience: { label: "Work", path: ["about", "experience"], sum: it => [it.org, (it.roles || []).map(r => r.title).join(", ")],
    fields: [{ key: "org", label: "Company / place" }, { key: "url", type: "url", label: "Link" }, { key: "roles", type: "roles", label: "Roles: one per line as  Title | dates", wide: true }] },
  socials: { label: "Links", path: ["socials"], sum: it => [it.label, it.url],
    fields: [{ key: "label", label: "Label" }, { key: "icon", type: "select", options: ["github", "code", "film", "game", "book", "palette", "instagram", "x", "linkedin", "mail", "link"], label: "Icon" }, { key: "url", type: "url", label: "URL (mailto: for email)", wide: true }] },
};
const PROFILE = [
  { path: ["name"], label: "Name" }, { path: ["initial"], label: "Initial (favicon)" },
  { path: ["description"], label: "Site description (search engines)", wide: true },
  { path: ["status", "lead"], label: "Home · first line" }, { path: ["status", "big"], label: "Home · grey capitals" },
  { path: ["status", "tail"], label: "Home · last line" }, { path: ["status", "note"], label: "Home · small note (empty = latest post)" },
  { path: ["about", "bio"], type: "paras", label: "About · bio (blank line = new paragraph)", wide: true },
  { path: ["about", "signoff"], label: "About · sign-off" }, { path: ["about", "avatar"], type: "media", folder: "me", label: "About · photo" },

/* ---------- state ---------- */

/* ---------- one input, any type ---------- */

        h("button", { type: "button", class: "r", tabindex: "-1", "aria-label": `${n} stars`, onclick: () => put(n) }));

      h("button", { type: "button", class: "btn small", onclick: () => file.click() }, "Upload"),
      h("button", { type: "button", class: "btn small", onclick: () => { path.value = ""; set(undefined); show(""); } }, "Remove")), file)));
    return wrap;
  }
  if (def.type === "textarea" || def.type === "paras" || def.type === "roles") {

      : def.type === "roles" ? (value || []).map(r => `${r.title || ""} | ${r.dates || ""}`).join("\n") : value || "";
    wrap.append(h("textarea", { dir: "auto", oninput: e => {

/* ---------- add a movie by searching TMDB: title, year and director fill in on their own ---------- */

    const mark = i => {

      rows.forEach((li, k) => li.classList.toggle("sel", k === sel));
      rows[sel].scrollIntoView({ block: "nearest" });
    };
    function render() {
      list.textContent = "";
      results.forEach((r, i) => {
        const year = (r.release_date || "").slice(0, 4);

        list.append(h("li", { class: i === sel ? "sel" : "" }, h("button", { type: "button", onclick: () => pick(r) },

          h("span", { class: "meta" }, h("b", { dir: "auto" }, r.title), h("small", {}, year || "no date"), have ? h("small", { class: "have" }, " · already in your list") : null))));

      const tm = raw.match(/themoviedb\.org\/movie\/(\d+)/i), im = raw.match(/imdb\.com\/(?:[a-z-]+\/)?title\/(tt\d+)/i);

      if (/boxd\.it\//i.test(raw)) { list.textContent = ""; list.append(h("li", { class: "none" }, "Short boxd.it links can't be read here. Open it and paste the full letterboxd.com/film/… address.")); return; }

        if (mine !== seq) return;

      const lbYear = fromLb && fromLb[2] && +fromLb[2] <= new Date().getFullYear() + 3 ? fromLb[2] : ""; // "blade-runner-2049" is a title, not a year
      const ym = fromLb ? [, (lbYear ? fromLb[1] : lb[1].replace(/-\d$/, "")).replace(/-/g, " "), lbYear] : raw.match(/^(.*\S)\s+((?:19|20)\d\d)$/); // "arrival 2016"

      if (dupe >= 0) { toast("Already in your list"); hide(); onAdd(dupe); return; }

    q.addEventListener("keydown", e => {

  }
  wrap.open = show;
  return wrap;
}

/* ---------- add a game or book by searching: no key needed ----------
   Games: Wikidata (title, first release year, developer, Steam id for the cover).

const getJSON = async url => { const r = await fetch(url); if (!r.ok) throw new Error(`Search failed (${r.status})`); return r.json(); };
const SHELF_SEARCH = {
  games: {
    noun: "game", placeholder: "Type a game title…",
    async search(q) {
      const WD = "https://www.wikidata.org/w/api.php?format=json&origin=*";
      const s = await getJSON(`${WD}&action=wbsearchentities&type=item&language=en&uselang=en&limit=20&search=${encodeURIComponent(q)}`);
      const hits = (s.search || []).filter(x => /video game/i.test(x.description || "")).slice(0, 8);
      if (!hits.length) return [];
      const e = (await getJSON(`${WD}&action=wbgetentities&props=claims|labels&languages=en&ids=${hits.map(x => x.id).join("|")}`)).entities || {};
      const val = (c, p) => ((c[p] || []).map(x => x.mainsnak && x.mainsnak.datavalue && x.mainsnak.datavalue.value).filter(Boolean));
      const devIds = [...new Set(hits.flatMap(x => val((e[x.id] || {}).claims || {}, "P178").map(v => v.id)))].slice(0, 50);
      const devs = devIds.length ? (await getJSON(`${WD}&action=wbgetentities&props=labels&languages=en&ids=${devIds.join("|")}`)).entities || {} : {};
      return hits.map(x => {
        const c = (e[x.id] || {}).claims || {};
        const years = val(c, "P577").map(v => Number(String(v.time).slice(1, 5))).filter(Boolean);
        const steam = val(c, "P1733")[0];
        return {
          title: x.label, year: years.length ? Math.min(...years) : "", key: x.id,
          by: val(c, "P178").map(v => ((devs[v.id] || {}).labels || {}).en).filter(Boolean).map(l => l.value).slice(0, 2).join(" & "),
          img: steam ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${steam}/library_600x900.jpg` : "",
          extra: steam ? { steam: Number(steam) || steam } : {},
        };
      });
    },
  },
  books: {
    noun: "book", placeholder: "Type a book title or author…",
    async search(q) {
      const r = await getJSON(`https://openlibrary.org/search.json?limit=8&fields=key,title,author_name,first_publish_year,cover_i&q=${encodeURIComponent(q)}`);
      return (r.docs || []).map(d => ({
        title: d.title, year: d.first_publish_year || "", key: d.key, by: (d.author_name || []).slice(0, 2).join(" & "),
        img: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : "",

};

/* ---------- import real watch dates from a Letterboxd export (.zip, or diary.csv / watched.csv) ---------- */
function parseCSV(text) {

  text = text.replace(/^﻿/, "");

    const c = text[i];
    if (quoted) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else quoted = false; } else cur += c; }
    else if (c === '"') quoted = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift() || [];
  return rows.map(r => Object.fromEntries(head.map((k, i) => [k.trim(), (r[i] || "").trim()])));
}

  let p = dv.getUint32(end + 16, true);
  for (let n = 0; n < count && dv.getUint32(p, true) === 0x02014b50; n++) {

    let data = u8.subarray(start, start + size);

    for (const map of maps) {
      const hit = (map.get(titleKey(mv.title)) || []).filter(x => !mv.year || !x.year || Math.abs(x.year - mv.year) <= 1);
      if (hit.length) { best = hit.map(x => x.date).sort().pop(); break; } // a rewatch counts as the latest date
    }
    if (!best) { missing.push(mv.title); continue; }
    matched++;
    if (mv.watched !== best) { mv.watched = best; changed++; }
  }
  return { matched, changed, missing };
}

/* ---------- Sync Letterboxd: pull your recent diary (new films, watch dates, ratings, ♥) ---------- */
async function syncLetterboxd(items) {
  const res = await fetch("/api/letterboxd", LOCAL ? { headers: { "X-Admin-Token": TOKEN } } : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Couldn't reach Letterboxd.");
  const entries = data.entries || []; // newest first
  const latest = new Map(); // the newest diary entry of each film wins
  for (const e of entries) { const k = e.tmdb ? "t" + e.tmdb : titleKey(e.title) + (e.year || ""); if (!latest.has(k)) latest.set(k, e); }
  const updated = [], fresh = [];
  for (const e of latest.values()) {
    const mv = items.find(m => e.tmdb && m.tmdb === e.tmdb)
      || items.find(m => titleKey(m.title) === titleKey(e.title) && (!m.year || !e.year || Math.abs(m.year - e.year) <= 1));
    if (!mv) { fresh.push(e); continue; }
    let changed = false;
    // only fill gaps or move forward: never overwrite a rating you changed on purpose, never go back in time
    if (e.watched > (mv.watched || "")) { mv.watched = e.watched; changed = true; }
    if (e.rating !== undefined && mv.rating === undefined) { mv.rating = e.rating; changed = true; }
    if (e.liked && !mv.liked) { mv.liked = true; changed = true; }
    if (e.tmdb && !mv.tmdb) { mv.tmdb = e.tmdb; changed = true; }
    if (changed) updated.push(mv.title);
  }
  const added = [];
  for (const e of fresh.sort((a, b) => a.watched.localeCompare(b.watched))) { // oldest first, so the newest ends up on top
    const m = { title: e.title, watched: e.watched };
    if (e.year) m.year = e.year;
    if (e.tmdb) m.tmdb = e.tmdb;
    if (e.rating !== undefined) m.rating = e.rating;
    if (e.liked) m.liked = true;
    if (e.tmdb && tmdbKey()) { // director, if you've set up the TMDB key
      try { const c = await tmdb(`/movie/${e.tmdb}/credits`); const by = (c.crew || []).filter(x => x.job === "Director").map(x => x.name).slice(0, 2).join(" & "); if (by) m.by = by; } catch (_) {}
    }
    items.unshift(m); added.push(e.title);
  }
  return { total: entries.length, added, updated };
}

function missing(id, it) {

}

/* ---------- Top 4: choose the four films and a poster for each ----------
   Posters: any poster TMDB has for the film (official, alternative, textless, international),
   one you upload yourself (e.g. a fan poster you have permission to use), or the Letterboxd one. */
const posterCache = new Map();
async function findPosters(m) {
  const k = `${m.title}|${m.year || ""}`;
  if (posterCache.has(k)) return posterCache.get(k);
  const job = (async () => {
    let hit = m.tmdb ? { id: m.tmdb } : null, r;
    if (!hit) { r = await tmdb("/search/movie", { query: m.title, year: m.year }); hit = r.results && r.results[0]; }
    if (!hit && m.year) { r = await tmdb("/search/movie", { query: m.title }); hit = r.results && r.results[0]; }
    if (!hit) return [];
    const imgs = await tmdb(`/movie/${hit.id}/images`, { include_image_language: "en,null" });
    return (imgs.posters || []).sort((a, b) => b.vote_count - a.vote_count || b.vote_average - a.vote_average).slice(0, 40).map(p => p.file_path);
  })();

// posters are resized in the browser before they're uploaded, so the site stays light
async function shrinkPoster(blob, w, q = .84, type = "image/jpeg") {
  try {
    const bmp = await createImageBitmap(blob);
    if (bmp.width <= w) return blob;
    const c = document.createElement("canvas");
    c.width = w; c.height = Math.round(bmp.height * w / bmp.width);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || blob), type, q));
  } catch (_) { return blob; }
}
const coverSlug = t => !/[^\p{sc=Latin}\P{L}]/u.test(t) && slugify(t) || String(t).toLowerCase().normalize("NFKD").replace(/[^\p{L}\p{N}\s-]/gu, "").trim().replace(/\s+/g, "-").replace(/-+/g, "-"); // Arabic titles keep their letters (same rule in build.js)

const filmKeyOf = m => `${m.title}|${m.year || ""}`;

/* One poster chooser: current poster, TMDB posters, upload, back to Letterboxd.

// covers on Open Library for a book: by title and author, then by title alone (each edition can have its own cover)
async function findBookCovers(b) {
  const author = String(b.by || "").split(/&| and /)[0].trim(), ids = [];
  const q = async params => { const r = await getJSON(`https://openlibrary.org/search.json?limit=10&fields=cover_i,edition_count&${params}`); (r.docs || []).forEach(d => { if (d.cover_i && !ids.includes(d.cover_i)) ids.push(d.cover_i); }); };
  if (author) await q(`title=${encodeURIComponent(b.title)}&author=${encodeURIComponent(author)}`).catch(() => {});
  if (ids.length < 6) await q(`title=${encodeURIComponent(b.title)}`).catch(() => {});
  if (b.olCover && !ids.includes(b.olCover)) ids.unshift(b.olCover);
  return ids.slice(0, 12).map(id => ({ id, thumb: `https://covers.openlibrary.org/b/id/${id}-M.jpg`, full: `https://covers.openlibrary.org/b/id/${id}-L.jpg` }));
}

/* ---------- Photos: the picture beside each director, actor and studio on Stats ----------
   The build lists who Stats shows (admin/people.json) and finds a picture for each on Wikimedia.
   Here you can choose another one: from TMDB (photos and company logos), Wikimedia Commons, or your own upload.
   Your choices are kept in site.photos / site.logos (name → file). */
const PIC_KINDS = { person: { key: "photos", folder: "people", width: 160, type: "image/jpeg" }, studio: { key: "logos", folder: "studios", width: 200, type: "image/png" } };
const picCache = new Map();
const cached = (k, job) => { if (!picCache.has(k)) { const p = job(); picCache.set(k, p); p.catch(() => picCache.delete(k)); } return picCache.get(k); };
// TMDB: a person's profile photos (directors and actors), or a company's logos
const tmdbPics = (kind, name, role) => cached(`t|${kind}|${name}`, async () => {

const commonsPics = (kind, name) => cached(`c|${kind}|${name}`, async () => {

/* Crop a picture for Stats: drag to move it, zoom with the slider (or scroll), see exactly what shows in the circle.
   Resolves to a square image (people: JPEG on dark, studios: PNG keeping transparency), or null if cancelled. */
function cropPicture(blob, kind) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); toast("Couldn't open that picture", true); resolve(null); };
    img.onload = () => {
      const V = 260, OUT = 256, studio = kind === "studio";
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const contain = Math.min(V / nw, V / nh), cover = Math.max(V / nw, V / nh);
      const lo = contain, hi = cover * 5;
      let scale = studio ? contain * .9 : cover, x = 0, y = 0;
      // portraits: start near the top, where faces usually are
      if (!studio && nh * scale > V) y = (nh * scale - V) / 2 * .55;
      const pic = h("img", { src: url, alt: "", draggable: "false" });
      const view = h("div", { class: `crop-view ${kind}` }, pic, h("i", { class: "crop-ring" }));
      const clamp = () => {
        const w = nw * scale, hh = nh * scale, lx = Math.abs(w - V) / 2, ly = Math.abs(hh - V) / 2;
        x = Math.max(-lx, Math.min(lx, x)); y = Math.max(-ly, Math.min(ly, y));
      };
      const draw = () => { clamp(); pic.style.width = nw * scale + "px"; pic.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`; };
      // slider: 0…1000, even steps on a log scale between "whole picture" and 5× "fills the circle"
      const toSlider = s => Math.round(Math.log(s / lo) / Math.log(hi / lo) * 1000);
      const fromSlider = v => lo * Math.pow(hi / lo, v / 1000);
      const zoom = h("input", { type: "range", min: 0, max: 1000, value: toSlider(scale), "aria-label": "Zoom", oninput: () => setScale(fromSlider(+zoom.value)) });
      const setScale = s => { const k = Math.max(lo, Math.min(hi, s)) / scale; scale *= k; x *= k; y *= k; zoom.value = toSlider(scale); draw(); };
      let drag = null;
      view.addEventListener("pointerdown", e => { drag = { id: e.pointerId, sx: e.clientX - x, sy: e.clientY - y }; view.setPointerCapture(e.pointerId); view.classList.add("dragging"); });
      view.addEventListener("pointermove", e => { if (drag && e.pointerId === drag.id) { x = e.clientX - drag.sx; y = e.clientY - drag.sy; draw(); } });
      const end = () => { drag = null; view.classList.remove("dragging"); };
      view.addEventListener("pointerup", end); view.addEventListener("pointercancel", end);
      view.addEventListener("wheel", e => { e.preventDefault(); setScale(scale * Math.exp(-e.deltaY * .0015)); }, { passive: false });
      const finish = async ok => {
        let out = null;
        if (ok) {
          const c = document.createElement("canvas"); c.width = c.height = OUT;
          const g = c.getContext("2d"), r = OUT / V, w = nw * scale, hh = nh * scale;
          if (!studio) { g.fillStyle = "#141414"; g.fillRect(0, 0, OUT, OUT); }
          g.imageSmoothingQuality = "high";
          g.drawImage(img, (V / 2 + x - w / 2) * r, (V / 2 + y - hh / 2) * r, w * r, hh * r);
          out = await new Promise(res => c.toBlob(res, studio ? "image/png" : "image/jpeg", .88));
        }
        dlg.close(); dlg.remove(); URL.revokeObjectURL(url); resolve(out);
      };
      const dlg = h("dialog", { class: "poster-dlg crop-dlg", oncancel: e => { e.preventDefault(); finish(false); } },
        h("header", {}, h("b", {}, "Move and resize"), h("button", { class: "btn small x", "aria-label": "Cancel", onclick: () => finish(false) }, "×")),
        view,
        h("label", { class: "crop-zoom" }, h("span", {}, "−"), zoom, h("span", {}, "+")),
        h("p", { class: "status crop-hint" }, "Drag the picture to move it. Use the slider (or scroll) to zoom."),
        h("div", { class: "crop-actions" },
          h("button", { class: "btn small", onclick: () => { scale = studio ? contain * .9 : cover; x = 0; y = 0; zoom.value = toSlider(scale); draw(); } }, "Reset"),
          h("button", { class: "btn small", onclick: () => finish(false) }, "Cancel"),
          h("button", { class: "btn primary small", onclick: () => finish(true) }, "Use this")));
      document.body.append(dlg);
      dlg.showModal(); draw();
    };
    img.src = url;
  });
}

function photoCell(kind, p, dlg) {

  const own = () => site[K.key][p.name] || "";
  const src = () => own() ? thumbUrl(own()) : p.found ? "/" + p.found : "";
  const pic = () => src() ? h("img", { class: `pic ${kind}`, src: src(), alt: "", loading: "lazy", onerror: e => e.target.replaceWith(h("span", { class: `pic ${kind} ph` }, "—")) }) : h("span", { class: `pic ${kind} ph` }, "none");
  const cell = h("button", { class: "ph-cell" + (own() ? " own" : ""), title: p.name, onclick: () => openPhotoPicker(kind, p, dlg, () => { cell.classList.toggle("own", !!own()); cell.firstChild.replaceWith(pic()); }) }, pic(), h("span", {}, p.name));
  return cell;
}

function openPhotoPicker(kind, p, dlg, changed) {
  const K = PIC_KINDS[kind];
  const own = () => site[K.key][p.name] || "";
  const now = h("div", { class: "photo-now" });
  const showNow = () => {
    now.textContent = "";
    const src = own() ? thumbUrl(own()) : p.found ? "/" + p.found : "";
    now.append(src ? h("img", { class: `pic ${kind}`, src, alt: "" }) : h("span", { class: `pic ${kind} ph` }, "none"), h("small", {}, own() ? "Your choice" : p.found ? "Found on Wikimedia" : "Initials"));
  };
  const done = () => { markDirty(); showNow(); changed(); };
  const choose = async (blob, label) => {
    try {
      const small = await cropPicture(blob, kind); // you place it in the circle first
      if (!small) return;
      const ext = (small.type || "").includes("png") ? ".png" : ".jpg";
      site[K.key][p.name] = await upload(new File([small], `${slugify(p.name) || "pic"}-own${ext}`, { type: small.type || K.type }), K.folder);
      done(); toast(`${label} chosen · press Save`);
    } catch (e) { toast(e.message, true); }
  };
  const strip = (title, find) => {
    const row = h("div", { class: "strip photos" }, h("span", { class: "status" }, "…"));
    find().then(list => {
      row.textContent = "";
      if (!list.length) return row.append(h("span", { class: "status" }, "Nothing found."));
      list.forEach(c => row.append(h("button", { class: `still photo ${kind}`, title: c.from, "aria-label": `Use this picture for ${p.name}`, onclick: async e => {
        const b = e.currentTarget; b.disabled = true;
        try {
          const res = await fetch(c.full);
          if (!res.ok) throw new Error("Couldn't download that picture");
          dlg.querySelectorAll(".still").forEach(x => x.classList.toggle("on", x === b));
          await choose(await res.blob(), "Picture");
        } catch (err) { toast(err.message, true); } finally { b.disabled = false; }
      } }, h("img", { src: c.thumb, alt: "", loading: "lazy" }))));
    }).catch(e => { row.textContent = ""; row.append(h("span", { class: "status" }, e.message)); });
    return [h("h4", { class: "strip-h" }, title), row];
  };
  const fileIn = h("input", { type: "file", accept: "image/jpeg,image/png,image/webp", style: "display:none", onchange: () => { const f = fileIn.files[0]; if (f) choose(f, "Your picture"); fileIn.value = ""; } });
  const adjust = async () => {
    try {
      let src = own() ? thumbUrl(own()) : "";
      if (!src && p.file) try {
        const r = await (await fetch(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=600&titles=${encodeURIComponent("File:" + p.file)}`)).json();
        src = ((Object.values((r.query || {}).pages || {})[0] || {}).imageinfo || [])[0]?.thumburl || "";
      } catch (_) {}
      if (!src && p.found) src = "/" + p.found;
      if (!src) return toast("No picture to adjust yet: choose or upload one", true);
      const res = await fetch(src);
      if (!res.ok) throw new Error("Couldn't load the picture");
      await choose(await res.blob(), "Picture");
    } catch (e) { toast(e.message, true); }
  };
  dlg.textContent = "";
  dlg.append(
    h("header", {}, h("b", {}, p.name), h("small", {}, ` ${p.role === "director" ? "director" : p.role === "cast" ? "cast" : "studio"}`), h("button", { class: "btn small x", "aria-label": "Close", onclick: () => dlg.close() }, "×")),
    h("div", { class: "pd-tools" },
      h("button", { class: "btn small", onclick: adjust }, "Move and resize"),
      h("button", { class: "btn small", onclick: () => fileIn.click() }, "Upload your own"), fileIn,
      h("button", { class: "btn small", onclick: () => { if (own()) { delete site[K.key][p.name]; dlg.querySelectorAll(".still").forEach(x => x.classList.remove("on")); done(); } } }, p.found ? "Use the Wikimedia one" : "Use initials")),
    h("div", { class: "photo-row" }, now, h("div", { class: "photo-choices" },
      ...(tmdbKey() ? strip("TMDB", () => tmdbPics(kind, p.name, p.role)) : []),
      ...strip("Wikimedia Commons", () => commonsPics(kind, p.name)))));
  showNow();
  dlg.showModal();
}

/* sidebar: sections in groups, each with an icon (Lucide, ISC licence), a count, and a yellow mark when something is missing */
const ICONS = {
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>',
  movies: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18"/>',
  frames: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  posters: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M9 17h6"/>',
  photos: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7 21v-1a5 5 0 0 1 10 0v1"/>',
  books: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  games: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"/>',
  projects: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  designs: '<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 0 0 0 20c.9 0 1.6-.7 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.7 1.7-1.7H16a6 6 0 0 0 6-6c0-4.9-4.5-8.4-10-8.4Z"/>',
  qa: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  experience: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>',
  socials: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  posts: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  up: '<path d="m18 15-6-6-6 6"/>', down: '<path d="m6 9 6 6 6-6"/>', del: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
};
const icon = name => { const t = document.createElement("template"); t.innerHTML = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`; return t.content.firstChild; };
const LOGO_SVG = () => { const t = document.createElement("template"); t.innerHTML = '<svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6v20M7 16h14M13 6h12l-8 20"/></svg>'; return t.content.firstChild; };
const SECTIONS = [
  ["Site", [["profile", "Profile & home"]]],
  ["Shelf", [["movies"], ["frames", "Frame picker"], ["posters", "Posters"], ["photos", "Photos"], ["books"], ["games"]]],
  ["Work", [["projects"], ["designs"]]],
  ["About", [["qa"], ["experience"], ["socials"]]],
  ["Writing", [["posts", "Posts"]]],
];
const sectionLabel = id => { for (const [, items] of SECTIONS) for (const [k, l] of items) if (k === id) return l || LISTS[k].label; return id; };
function drawNav() {
  const nav = $("#nav"); nav.textContent = "";
  if (!STATUS) loadStatus().then(() => site && drawNav());
  nav.append(h("div", { class: "brand" }, h("span", { class: "logo" }, LOGO_SVG()), h("span", {}, h("b", {}, site.name), "Editor")),
    h("button", { class: "jump", type: "button", onclick: openJumper }, icon("search"), "Jump to…", h("kbd", {}, "Ctrl K")));
  for (const [group, items] of SECTIONS) {
    nav.append(h("div", { class: "group" }, group));
    for (const [id, label] of items) {
      const def = LISTS[id], bad = def && listOf(def).some(it => missing(id, it).length);
      nav.append(h("button", { class: "nv", "aria-current": section === id ? "page" : false, onclick: () => go(id) },
        icon(id), h("span", { class: "lb" }, label || def.label), bad ? h("i", { class: "wd", title: "Something is missing" }) : null, def ? h("span", { class: "ct" }, listOf(def).length) : ""));
    }
  }
  nav.append(h("div", { class: "foot" }, footText()));
  const cur = $("nav button[aria-current]");
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
}

/* Ctrl+K: jump to any section, film, book, game, project… */
function openJumper() {
  if (!site) return;
  const all = [];
  for (const [, items] of SECTIONS) for (const [id] of items) all.push({ t: sectionLabel(id), k: "Section", go: () => go(id) });
  for (const [id, def] of Object.entries(LISTS)) listOf(def).forEach((it, i) => { const t = def.sum(it)[0]; if (t) all.push({ t: String(t), k: def.label, go: () => { go(id); openItem(i); } }); });
  const q = h("input", { type: "search", placeholder: "Jump to a section or anything in your lists…", "aria-label": "Jump to" });
  const ul = h("ul");
  const dlg = h("dialog", { class: "jumper" }, q, ul);
  let hits = [], sel = 0;
  const draw = () => {
    const s = q.value.trim().toLowerCase();
    hits = (s ? all.filter(x => x.t.toLowerCase().includes(s)) : all.filter(x => x.k === "Section")).slice(0, 40);
    sel = Math.min(sel, Math.max(0, hits.length - 1));
    ul.textContent = "";
    hits.forEach((x, i) => ul.append(h("li", { class: i === sel ? "sel" : "" }, h("button", { type: "button", onclick: () => pickIt(x) }, x.t, h("small", {}, x.k)))));
    if (!hits.length) ul.append(h("li", { class: "none" }, "Nothing found."));
    const s2 = ul.children[sel]; if (s2) s2.scrollIntoView({ block: "nearest" });
  };
  const pickIt = x => { dlg.close(); x.go(); };
  q.addEventListener("input", () => { sel = 0; draw(); });
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % Math.max(1, hits.length); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + hits.length) % Math.max(1, hits.length); draw(); }
    else if (e.key === "Enter" && hits[sel]) { e.preventDefault(); pickIt(hits[sel]); }
  });
  dlg.addEventListener("close", () => dlg.remove());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  document.body.append(dlg); draw(); dlg.showModal(); q.focus();
}
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k" && site) { e.preventDefault(); if (!$("dialog.jumper[open]")) openJumper(); } });
// open item i of the list on screen (after go())
function openItem(i) { const box = $("#main .items"); if (box && box._draw) { box._draw(i); const el = $(".item.open"); if (el) el.scrollIntoView({ block: "center" }); } }
function go(id) {
  if (section === "posts" && id !== "posts" && $("#main textarea.body") && !confirm("Leave this post? Unsaved text will be lost.")) return;
  section = id; history.replaceState(null, "", "#" + id); drawNav();
  if (id === "profile") viewProfile(); else if (id === "posts") viewPosts(); else if (id === "frames") viewFrames(); else if (id === "posters") viewPosters(); else if (id === "photos") viewPhotos(); else viewList(id);
}
const valid = id => id === "profile" || id === "posts" || id === "frames" || id === "posters" || id === "photos" || !!LISTS[id];
addEventListener("hashchange", () => { const id = location.hash.slice(1); if (site && valid(id) && id !== section) go(id); });

/* ---------- GitHub sign-in (only on the live site) ---------- */
function loadCfg() {
  for (const s of [sessionStorage, localStorage]) { try { const c = JSON.parse(s.getItem(CFG_KEY) || "null"); if (c && c.token) return c; } catch (_) {} }
  return null;
}
function signOut() {
  if (dirty && !confirm("You have unsaved changes. Sign out anyway?")) return;
  try { localStorage.removeItem(CFG_KEY); sessionStorage.removeItem(CFG_KEY); } catch (_) {}
  dirty = false; location.reload();
}
function showLogin(msg) {
  document.body.textContent = "";
  let last = {};
  try { last = JSON.parse(localStorage.getItem(CFG_KEY + "-repo") || "{}"); } catch (_) {}
  const repo = h("input", { type: "text", placeholder: "your-username/my-website", value: last.repo || "", autocapitalize: "off", autocorrect: "off", spellcheck: "false" });
  const branch = h("input", { type: "text", value: last.branch || "main", autocapitalize: "off", autocorrect: "off" });
  const token = h("input", { type: "password", placeholder: "github_pat_…", autocomplete: "off", autocapitalize: "off", spellcheck: "false" });
  const remember = h("input", { type: "checkbox", checked: true });
  const btn = h("button", { class: "btn primary", type: "button" }, "Connect");
  const err = h("p", { class: "note", style: "color:#ff8a8a" }, msg || "");
  btn.onclick = async () => {
    const cfg = { repo: repo.value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\.git$|\/$/g, ""), branch: branch.value.trim() || "main", token: token.value.trim() };
    if (!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo) || !cfg.token) { err.textContent = "Fill in the repository (owner/name) and your token."; return; }
    btn.disabled = true; err.textContent = "";
    gh = cfg;
    try {
      const info = await ghReq("");
      if (!info.permissions || !info.permissions.push) throw new Error("This token can read the repository but not write to it. Give it Contents: Read and write.");
      try {
        localStorage.setItem(CFG_KEY + "-repo", JSON.stringify({ repo: cfg.repo, branch: cfg.branch }));
        (remember.checked ? localStorage : sessionStorage).setItem(CFG_KEY, JSON.stringify(cfg));
      } catch (_) {}
      start();
    } catch (e) { gh = null; err.textContent = e.message; btn.disabled = false; }
  };
  token.addEventListener("keydown", e => { if (e.key === "Enter") btn.click(); });
  document.body.append(h("div", { class: "login" },
    h("h1", {}, "Editor"),
    h("p", {}, "Connect to the GitHub repository that holds your site. Only someone with your token can make changes."),
    h("label", { class: "field" }, h("span", {}, "Repository"), repo),
    h("label", { class: "field" }, h("span", {}, "Branch"), branch),
    h("label", { class: "field" }, h("span", {}, "Fine-grained personal access token (Contents: read & write, this repository only)"), token),
    h("label", { class: "check", style: "padding-top:0" }, remember, "Remember on this device"),
    btn, err,
    h("p", { class: "note" }, "Your token is stored only in this browser and is sent only to api.github.com.")));
  (last.repo ? token : repo).focus();
}

async function start() {
  document.body.textContent = "";
  document.body.append(h("nav", { id: "nav", "aria-label": "Sections" }), h("main", { id: "main" }), h("div", { class: "toast", id: "toast", role: "status" }));
  try { site = await store.getSite(); }
  catch (e) {
    if (!LOCAL) return showLogin(e.message);
    document.body.textContent = "Could not load content: " + e.message; return;
  }
  const first = location.hash.slice(1);
  go(valid(first) ? first : "profile");
}

if (LOCAL) start();
else { gh = loadCfg(); if (gh) start(); else showLogin(); }
</script>
